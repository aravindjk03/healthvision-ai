# Publishes the browser-only HealthVision AI (web-demo/) to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# GitHub Pages on a private repository needs a paid GitHub plan; on a free plan the repository
# must be public. The site itself is public to anyone with the URL; photos are still processed
# only inside each visitor's browser.
name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web-demo/**", "models/registry.yaml", "tools/fetch_models.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download and verify model files
        run: |
          pip install pyyaml
          python tools/fetch_models.py
      - name: Build site
        working-directory: web-demo
        run: |
          npm ci
          python build.py --standalone
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
