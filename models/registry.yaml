# Model registry (docs/03 §7). Files are downloaded on first use and verified by SHA-256.
# performance_metrics.local_validated stays null until tools produce real evaluation runs.
models:
  - model_id: face_detector.yunet
    model_type: FACE_DETECTOR
    name: YuNet
    version: "2023mar"
    source: https://github.com/opencv/opencv_zoo/tree/main/models/face_detection_yunet
    url: https://huggingface.co/opencv/face_detection_yunet/resolve/main/face_detection_yunet_2023mar.onnx
    file: face_detection_yunet_2023mar.onnx
    sha256: 8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4
    license: MIT
    license_status: APPROVED
    deployment_format: onnx
    runtime: opencv-dnn
    input_size: dynamic
    training_validation_date: "vendor 2023-03; local validation PENDING"
    performance_metrics: {vendor_reported: "see OpenCV Zoo model card", local_validated: null}
    known_limitations:
      - Reduced recall on very small faces and extreme profiles
      - Not validated locally for skin-tone or lighting subgroups

  - model_id: landmarks.mediapipe_face_landmarker
    model_type: LANDMARKS
    name: MediaPipe Face Landmarker
    version: "float16/1"
    source: https://ai.google.dev/edge/mediapipe/solutions/vision/face_landmarker
    url: https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task
    file: face_landmarker.task
    sha256: 64184e229b263107bc2b804c6625db1341ff2bb731874b0bcc2fe6544e0bc9ff
    license: Apache-2.0
    license_status: APPROVED
    deployment_format: task
    runtime: mediapipe
    input_size: dynamic
    training_validation_date: "vendor; local validation PENDING"
    performance_metrics: {vendor_reported: "see model card", local_validated: null}
    known_limitations:
      - Degrades under heavy occlusion
      - Geometry only; never interpreted medically

  - model_id: landmarks.fivepoint
    model_type: LANDMARKS
    name: Five-point fallback (detector keypoints)
    version: "1"
    source: built-in
    url: null
    file: null
    sha256: null
    license: n/a
    license_status: APPROVED
    deployment_format: none
    runtime: python
    input_size: n/a
    training_validation_date: n/a
    performance_metrics: {vendor_reported: null, local_validated: null}
    known_limitations:
      - Used only if MediaPipe is unavailable; pose is a coarse geometric estimate

  - model_id: expression.ferplus
    model_type: EXPRESSION
    name: FER+ (ONNX Model Zoo emotion-ferplus-8)
    version: "onnx-opset8"
    source: https://github.com/onnx/models/tree/main/validated/vision/body_analysis/emotion_ferplus
    url: https://github.com/onnx/models/raw/main/validated/vision/body_analysis/emotion_ferplus/model/emotion-ferplus-8.onnx
    file: emotion-ferplus-8.onnx
    sha256: a2a2ba6a335a3b29c21acb6272f962bd3d47f84952aaffa03b60986e04efa61c
    license: MIT
    license_status: APPROVED
    deployment_format: onnx
    runtime: onnxruntime
    input_size: [1, 1, 64, 64]
    labels: [neutral, happiness, surprise, sadness, anger, disgust, fear, contempt]
    training_validation_date: "vendor; local validation PENDING"
    performance_metrics: {vendor_reported: "see model card", local_validated: null}
    known_limitations:
      - Trained on low-resolution grayscale web images; posed expressions over-represented
      - Disgust and fear have low support
      - Estimates visible expression only; not an emotion detector

  - model_id: embedding.sface
    model_type: EMBEDDING
    name: SFace
    version: "2021dec"
    source: https://github.com/opencv/opencv_zoo/tree/main/models/face_recognition_sface
    url: https://huggingface.co/opencv/face_recognition_sface/resolve/main/face_recognition_sface_2021dec.onnx
    file: face_recognition_sface_2021dec.onnx
    sha256: 0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79
    license: Apache-2.0
    license_status: APPROVED
    deployment_format: onnx
    runtime: opencv-dnn
    input_size: [112, 112, 3]
    embedding_dim: 128
    similarity: cosine
    training_validation_date: "vendor 2021-12; local validation PENDING"
    performance_metrics: {vendor_reported: "see OpenCV Zoo model card", local_validated: null}
    known_limitations:
      - No liveness detection
      - Threshold not calibrated on local data (demo mode)

  - model_id: liveness.none
    model_type: LIVENESS
    name: Not implemented
    version: "none"
    source: n/a
    url: null
    file: null
    sha256: null
    license: n/a
    license_status: APPROVED
    deployment_format: none
    runtime: none
    input_size: n/a
    training_validation_date: n/a
    performance_metrics: {vendor_reported: null, local_validated: null}
    known_limitations:
      - Liveness detection is not implemented in this version
